[package]
name = "clarim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Clarim: mic AI noise suppression into a virtual mic + per-app output channels"

[dependencies]
clarim-core.workspace = true
clarim-audio.workspace = true
clarim-routing.workspace = true
clarim-web.workspace = true
clarim-svc.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger = "0.11"
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
# 0.27, not 0.26: Cargo resolves `links` for every platform, and 0.26 (libappindicator -> gtk-sys 0.18) clashes
# with tao's gtk-sys 0.19 even though neither is built on Windows.
tray-icon = "0.27"
# The dashboard window (`clarim window`): tao + wry (WebView2) + the Windows 11 Acrylic backdrop. They pull
# windows 0.62 next to the 0.58 used here; handles are passed between them as raw-window-handle only.
tao = "0.38"
wry = "0.58"
window-vibrancy = "0.8"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Com",
] }
